[project]
name = "claim-adjudication-assist"
version = "0.1.0"
description = "A LangGraph multi-agent system for health insurance claim intake and adjudication."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "aiosqlite==0.20.0",  # pinned: >=0.21 dropped Connection.is_alive(), which
                          # langgraph-checkpoint-sqlite 2.0.11's AsyncSqliteSaver calls
    "openai>=1.50,<2.0",
    "tiktoken>=0.7,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sse-starlette>=2.1,<3.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyyaml>=6.0,<7.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "networkx>=3.3,<4.0",
    "numpy>=1.26,<3.0",
    "boto3>=1.34,<2.0",
    "pypdf>=4.3,<5.0",
    "pdfplumber>=0.11,<1.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-sdk>=1.26,<2.0",
    "opentelemetry-exporter-prometheus>=0.47b0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
local = [
    "httpx>=0.27,<1.0",
]
aws = [
    "redis>=5.0,<6.0",
]
testdata = [
    "reportlab>=4.2,<5.0",
    "faker>=27.0,<28.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/app/graph", "src/app/validation", "src/app/memory"]
