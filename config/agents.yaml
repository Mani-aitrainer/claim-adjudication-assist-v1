defaults:
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.0
  max_tokens: 1500
  timeout_seconds: 60
  max_retries: 2
  pricing:                       # USD per 1M tokens — drives the cost metric
    input_per_1m: 0.40
    output_per_1m: 1.60

agents:
  intake_agent:                  # ClaimIntakeAgent
    temperature: 0.0
    max_tokens: 2000

  repair_agent:                  # FieldRepairAgent
    temperature: 0.2
    max_tokens: 2000
    prompt:
      technique: few_shot
      num_examples: 4
    retry:
      max_attempts: 2

  adjudicator_agent:             # PolicyAdjudicatorAgent
    model: gpt-4.1-mini
    temperature: 0.1
    max_tokens: 3000
    prompt:
      technique: chain_of_thought
      expose_reasoning: true     # keep trace in state, strip from API response
    retrieval:
      graph_hops: 2
      graph_hops_on_heal: 3
      vector_top_k: 6

  auditor_agent:                 # DecisionAuditorAgent
    temperature: 0.0
    max_tokens: 1200
    healing:
      quality_threshold: 0.75
      max_heal_attempts: 2

  embedding:
    model: text-embedding-3-small
    dimensions: 1536
    batch_size: 64

  graph_extraction:               # pipelines/data_pipeline.py ingest step — NOT an agent
    temperature: 0.0              # in the roster; kept in this file so its model/cost are
    max_tokens: 2000               # configured and tracked the same way every other LLM call is.

# ClaimValidatorAgent and HeuristicFallbackAgent make no LLM calls — no entry needed.
