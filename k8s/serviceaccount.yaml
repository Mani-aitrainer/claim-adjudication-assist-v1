# The role-arn annotation is filled in by scripts/render_k8s_config.sh from Terraform
# output `app_irsa_role_arn` — never hand-typed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claim-adjudication
  namespace: claim-adjudication
  annotations:
    eks.amazonaws.com/role-arn: __APP_IRSA_ROLE_ARN__
