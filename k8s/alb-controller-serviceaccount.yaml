# The AWS Load Balancer Controller's ServiceAccount, in kube-system.
#
# The Helm install uses `--set serviceAccount.create=false --set
# serviceAccount.name=aws-load-balancer-controller`, so this must exist BEFORE the chart
# is installed — otherwise the controller runs with no IAM identity and the Ingress never
# provisions an ALB.
#
# The role-arn annotation is filled in by scripts/render_k8s_config.sh from Terraform
# output `alb_controller_role_arn` — never hand-typed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/component: controller
  annotations:
    eks.amazonaws.com/role-arn: __ALB_CONTROLLER_ROLE_ARN__
