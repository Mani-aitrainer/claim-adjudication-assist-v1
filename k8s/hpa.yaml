apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claim-adjudication
  namespace: claim-adjudication
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claim-adjudication
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
