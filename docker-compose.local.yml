services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: claims-app
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://claims:claims@postgres:5432/claims
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    profiles:
      - app

  postgres:
    image: pgvector/pgvector:pg16
    container_name: claims-postgres
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    container_name: claims-prometheus
    volumes:
      - ./monitoring/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana
    container_name: claims-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
